name: Release skills
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skill-releases
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: npm ci --ignore-scripts
      - run: python -m tools.validate_repo
      - name: Validate discovered skill tests
        run: |
          python -c 'import subprocess, pathlib; from tools.validate_repo import skills; [subprocess.run(["python", "-m", "pytest", str(pathlib.Path(s)/"tests"), "-q"], check=True) for s in skills() if (pathlib.Path(s)/"tests").is_dir()]'
      - name: Release independently
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release.mjs
