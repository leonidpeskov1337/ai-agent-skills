name: Release skill
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag at default-branch tip: skill-name/v1.2.3'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.RELEASE_ENABLED == 'true'
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      skill: ${{ steps.target.outputs.skill }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Verify release target
        id: target
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -m tools.release_target
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: python -m tools.validate_repo
      - name: Test and package selected skill
        env:
          SKILL: ${{ steps.target.outputs.skill }}
        run: |
          python -m pytest tools/tests "$SKILL/tests" -q
          python -m tools.package_skill "$SKILL"
      - run: python -m tools.install_binary gitleaks
      - run: .ci-bin/gitleaks/gitleaks dir --redact --no-banner --config .gitleaks.toml .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish approved release
    needs: validate
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # No repository code executes in the write-token job.
      - name: Download validated package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq .sha)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          gh run download "$RUN_ID" --repo "$GH_REPO" --name release-package --dir dist
          (cd dist && sha256sum --check ./*.sha256)
          gh release create "$RELEASE_TAG" dist/* --repo "$GH_REPO" --verify-tag --generate-notes
