name: PR policy
on:
  workflow_call:
permissions:
  contents: read
jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Validate contributor branch name
        run: node tools/branch_policy.cjs
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --default-ignores=false --verbose
      - name: Validate every introduced commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "$HEAD_SHA^{commit}"
          npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
