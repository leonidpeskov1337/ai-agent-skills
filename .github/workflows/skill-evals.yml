name: Optional model evaluations
on:
  workflow_dispatch:
    inputs:
      skill:
        description: Skill to evaluate against paired synthetic cases
        type: choice
        options: [kubernetes-troubleshooter, gitlab-security-policies]
        required: true
permissions:
  contents: read
concurrency:
  group: model-evals-${{ inputs.skill }}
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.MODEL_EVALS_ENABLED == 'true'
    environment: model-evals
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: npm ci --ignore-scripts --prefix .github/model-evals
      - run: npm audit --audit-level=moderate --prefix .github/model-evals
      - name: Run paired baseline and skill tasks
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKILL: ${{ inputs.skill }}
        run: python -m tools.run_model_evals "$SKILL"
      - name: Preserve reports for rubric review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-evaluation-${{ inputs.skill }}
          path: model-results/
          if-no-files-found: warn
          retention-days: 30
