[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["tools/vendor", "*-workspace", ".ci-*", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["E402"]

[tool.pytest.ini_options]
norecursedirs = [".*", "venv", ".git", ".venv", ".ci-*", "node_modules", "dist", "*-workspace", "tools/vendor"]
addopts = "--import-mode=importlib -ra"
